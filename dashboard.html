<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGROCORP LIMITED Admin Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <h1>AGROCORP LIMITED Admin Dashboard</h1>
  <p id="status">Checking admin access...</p>

  <button id="logoutBtn" hidden>Logout</button>

  <script>
    const SUPABASE_URL = "https://firqrpeemkxtvdkhnwpx.supabase.co";
    const SUPABASE_KEY = "sb_publishable_DC8XvOjUsac-vzmXh5cKQQ_gJjwGrh3";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    async function checkAdmin() {
      const status = document.getElementById('status');

      const { data: { session }, error } =
        await supabaseClient.auth.getSession();

      if (error || !session) {
        window.location.replace('index.html');
        return;
      }

      const { data: admin, error: adminError } =
        await supabaseClient
          .from('admin_users')
          .select('user_id')
          .eq('user_id', session.user.id)
          .maybeSingle();

      if (adminError || !admin) {
        await supabaseClient.auth.signOut();
        window.location.replace('index.html');
        return;
      }

      status.textContent = 'Welcome, Admin! You are securely logged in.';
      document.getElementById('logoutBtn').hidden = false;
    }

    document.getElementById('logoutBtn').onclick = async () => {
      await supabaseClient.auth.signOut();
      window.location.replace('index.html');
    };

    checkAdmin();
  </script>

</body>
</html>
